services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: ai-football-live-predictor:latest
    container_name: afp-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////data/predictor.db}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HEADLESS: "true"
    volumes:
      - afp-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  monitor:
    image: ai-football-live-predictor:latest
    container_name: afp-monitor
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////data/predictor.db}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HEADLESS: "true"
    volumes:
      - afp-data:/data
    command: ["afp-monitor"]

volumes:
  afp-data:
