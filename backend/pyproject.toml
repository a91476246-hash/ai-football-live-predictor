[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-football-live-predictor"
version = "0.1.0"
description = "Live football match monitor and 2nd-half goal predictor."
readme = "../README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AI Football Live Predictor Contributors" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.30",
  "aiosqlite>=0.20.0",
  "asyncpg>=0.29.0",
  "httpx>=0.27.0",
  "playwright>=1.46.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.2.0",
  "pandas>=2.2.0",
  "scikit-learn>=1.5.0",
  "structlog>=24.4.0",
  "tenacity>=9.0.0",
  "websockets>=13.0",
  "python-multipart>=0.0.9",
  "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "types-beautifulsoup4>=4.12.0",
  "httpx>=0.27.0",
]

[project.scripts]
afp-monitor = "app.services.live_monitor:run"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF",
  "TID", "PT", "ASYNC", "PL", "N",
]
ignore = [
  "PLR0913",  # too many args (allowed for engine signatures)
  "PLR2004",  # magic-value comparisons (we deliberately use numeric thresholds)
  "PLR0911",  # too many return statements
  "PLC0415",  # imports outside top-level (used for CLI entry / circular avoidance)
  "B008",     # FastAPI's Depends() pattern in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_untyped_decorators = false
plugins = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests"]
pythonpath = ["."]
addopts = "-ra -q"

[tool.coverage.run]
branch = true
source = ["app"]
